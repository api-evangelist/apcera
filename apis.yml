name: Apcera
description: Apcera was an enterprise container and policy management platform founded in 2012 by
  Derek Collison, offering a "trusted cloud" runtime that layered fine-grained, policy-driven governance
  over workloads, containers, and services across hybrid infrastructure. Backed by a16z and DCVC, the
  company took a majority investment from Ericsson in 2015, was fully acquired by Ericsson in 2016, and
  the platform was subsequently wound down around 2017. The company is defunct - its primary domain
  (apcera.com) no longer resolves to a company site (it 301-redirects to an unrelated third party), and
  there is no live developer portal, API documentation, OpenAPI definition, or reachable API host to
  enrich. This profile is retained as a historical portfolio-lead record only.
